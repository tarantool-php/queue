name: QA
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * *'

jobs:
  tests:
    permissions:
      actions: read
      contents: read
    env:
      TNT_IMAGE: tarantool/tarantool:2.11
      PHP_IMAGE: php:8.2-cli
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        operating-system: [ubuntu-24.04]
        env:
          - TNT_IMAGE: tarantool/tarantool:3.7
          - TNT_IMAGE: tarantool/tarantool:3.6
          - TNT_IMAGE: tarantool/tarantool:3.5
          - TNT_IMAGE: tarantool/tarantool:3.4
          - TNT_IMAGE: tarantool/tarantool:3.3
          - TNT_IMAGE: tarantool/tarantool:3.2
          - TNT_IMAGE: tarantool/tarantool:3.1
          - TNT_IMAGE: tarantool/tarantool:3.0
          - TNT_IMAGE: tarantool/tarantool:2.11
          - TNT_IMAGE: tarantool/tarantool:2.10
          - TNT_IMAGE: tarantool/tarantool:2.8
          - TNT_IMAGE: tarantool/tarantool:2.7
          - TNT_IMAGE: tarantool/tarantool:2.6
          - TNT_IMAGE: tarantool/tarantool:2.5
          - TNT_IMAGE: tarantool/tarantool:2.4
          - TNT_IMAGE: tarantool/tarantool:2.3
          - TNT_IMAGE: tarantool/tarantool:2.2
          - TNT_IMAGE: tarantool/tarantool:2.1
          - TNT_IMAGE: tarantool/tarantool:1
          - TNT_IMAGE: tarantool/tarantool:1.9
          - TNT_IMAGE: tarantool/tarantool:1.7

          - PHP_IMAGE: php:8.5-cli
          - PHP_IMAGE: php:8.4-cli

          - PHP_IMAGE: php:8.2-cli
            QA: 1

          - COVERAGE_FILE: coverage.xml
            PHP_IMAGE: php:8.3-cli

    name: ${{ matrix.env.PHP_IMAGE || 'php:8.2-cli' }}, ${{ matrix.env.TNT_IMAGE || 'tarantool/tarantool:2.11' }}${{ matrix.env.QA && ', qa' || '' }}${{ matrix.env.COVERAGE_FILE && ', coverage' || '' }}
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build docker image
        env: ${{ matrix.env }}
        run: ./dockerfile.sh | tee /dev/tty | docker build -t queue -

      - name: Test
        env: ${{ matrix.env }}
        run: |
          docker network create tarantool-php
          docker run --net=tarantool-php --rm $TNT_IMAGE sh -c "tarantool --version"
          docker run -d --net=tarantool-php --name=tarantool -v `pwd`:/queue -e TNT_LISTEN_URI=$TNT_LISTEN_URI ${TNT_IMAGE} tarantool /queue/tests/Integration/queues.lua
          docker run --rm --net=tarantool-php -v `pwd`:/queue -w /queue queue

      - name: Check code quality
        env: ${{ matrix.env }}
        if: ${{ env.QA }}
        run: |
          docker run --net=tarantool-php --rm -v $PWD:/queue -w /queue queue php vendor/bin/php-cs-fixer fix --dry-run --diff --verbose .
          docker run --net=tarantool-php --rm -v $PWD:/queue -w /queue queue php vendor/bin/psalm

      - name: Upload code coverage report
        env: ${{ matrix.env }}
        if: ${{ env.COVERAGE_FILE }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ strategy.job-index }}
          path: ${{ env.COVERAGE_FILE }}

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage reports
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-reports

      - name: Add combined code coverage report to workflow summary
        uses: getsentry/coverage-action@0.3.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          directory: coverage-reports
          coverage-format: cobertura
          enable-tests: false
          name: full-test-matrix
